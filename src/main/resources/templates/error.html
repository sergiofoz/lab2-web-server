<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Servidor Web</title>
    <style>
        :root {
            --primary: #0284c7;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #ef4444;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
            text-align: center;
        }
        .error-code {
            font-size: 5.5rem;
            font-weight: 800;
            color: var(--accent);
            margin: 0;
            line-height: 1;
            letter-spacing: -2px;
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        .path-badge {
            display: inline-block;
            background-color: #0f172a;
            color: #38bdf8;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.9rem;
            border: 1px solid #1e293b;
            word-break: break-all;
        }
        .marker-text {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 2rem;
            border-top: 1px solid #334155;
            padding-top: 1rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="error-code" id="status" th:text="${status}">404</div>
    <h1>Página no encontrada</h1>
    <p>No se pudo localizar el recurso solicitado en la ruta:</p>
    <div class="path-badge" id="path" th:text="${path}">/missing</div>
    <div class="marker-text">
        Marker: Custom error page active
    </div>
</div>
</body>
</html>
